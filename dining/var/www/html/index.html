<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html {
  height: 100%;
  margin: 0;
}
body {
  height: 100%;
  margin: 0;
  background-image: url("house_winter_snow.jpg");
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
}
#hour, #second {
  border-radius: 50px;
  z-index: 2;
  font-size: 50pt;
  font-weight: bold;
  background-color: rgba(255, 255, 255, 0.5);
  position: fixed;
  display: inline-block;
}
#hour {
  padding: 0px 10px;
}
#second {
  text-align: center;
}
#date {
  border-radius: 0px 0px 12px 0px;
  padding-right: 4px;
  z-index: 2;
  font-size: 50pt;
  font-weight: bold;
  background-color: rgba(255, 255, 255, 0.5);
  position: fixed;
  top: 0;
  left: 0;
  display: inline-block;
  text-align: center;
}
#day {
  font-size: 150pt;
  margin-top: -20pt;
  margin-bottom: -20pt;
}
#nameday {
  font-size: 35pt;
}
#temp {
  border-radius: 0px 0px 0px 12px;
  padding-left: 4px;
  z-index: 2;
  font-size: 50pt;
  font-weight: bold;
  background-color: rgba(255, 255, 255, 0.5);
  position: fixed;
  top: 0;
  right: 0;
  display: inline-block;
}
</style>
<script src="holidays+.js"></script>
</head>
<body>
<span id="temp">20.0 &#176;C</span>
<span id="date">
  <div id="weekday"></div>
  <div id="day"></div>
  <div id="month"></div>
</span>

<span id="hour"></span>
<span id="second"></span>
<script>
  const stringToHex = (str) => {
    let hex = '';
    for (let i = 0; i < str.length; i++) {
      const charCode = str.charCodeAt(i);
      const hexValue = charCode.toString(16);

      // Pad with zeros to ensure two-digit representation
      hex += hexValue.padStart(2, '0');
    }
    return hex;
  };
  function writeTemp() {
    var xhr = new XMLHttpRequest();
    xhr.open('POST', "cli.php", true);
    xhr.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
    xhr.onload = function(e) {
      if (this.status == 200 && this.readyState === 4) {
        const output = JSON.parse(this.responseText);
        if (!isNaN(output[0])) {
          document.getElementById("temp").innerHTML = (parseFloat(output[0]) / 1000 + conf.rooms[room].thermostat.tempCorrection).toFixed(1) + " &#176;C"
        }
      }
    };
    xhr.send("cmd=cat&params="+stringToHex("/dev/shm/temp"));
  }

  function getConf() { // Get configuration
    const xhttp = new XMLHttpRequest();
    xhttp.onload = function(e) {
      if (this.status == 200) {
        if (typeof conf === 'undefined') {
          conf = JSON.parse(this.responseText);
          conf.lastModified = this.getResponseHeader('Last-Modified');
          // Get room
          var xhr = new XMLHttpRequest();
          xhr.open('POST', "cli.php", true);
          xhr.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
          xhr.onload = function(e) {
            if (this.status == 200 && this.readyState === 4) {
              const output = JSON.parse(this.responseText);
              for (room in conf.rooms) { // search Controller Room Name
                if (conf.rooms[room].Hostname == output[0]) {
                  break;
                }
              }
              document.getElementById("weekday").innerHTML = new Intl.DateTimeFormat(conf.l10n.language, { weekday: "long" }).format(new Date());
              document.getElementById("day").innerHTML = new Intl.DateTimeFormat(conf.l10n.language, { day: 'numeric'}).format(new Date());
              document.getElementById("month").innerHTML += new Intl.DateTimeFormat(conf.l10n.language, { month: 'long'}).format(new Date());

              // Special days
              const today = new Date();
              if (today.getDay() == 0) { // sunday
                document.getElementById("day").style.color = "darkred";
              }
              const overzicht = haalAlleFeestdagenOp(2026);
              for (const dag of Object.values(overzicht)) {
                if (today.getDate() == dag.datum.getDate() && today.getMonth() == dag.datum.getMonth()) { // holiday found
                  document.getElementById("day").style.color = "darkred";
                  document.getElementById("day").insertAdjacentHTML("afterend", "<div id='nameday'>" + dag.naam + "</div>");
                  break;
                }
              }

              setInterval(writeTime, 1000);
              writeTemp();
            }
          };
          xhr.send("cmd=cat&params="+stringToHex("/proc/sys/kernel/hostname"));
        } else if (conf.lastModified !== this.getResponseHeader('Last-Modified')) { // new configuration
          location.reload(true);
        } else {
          writeTemp();
        }
        setTimeout(getConf, 60000); // Every minute
      }
    }
    xhttp.open("POST", "data/conf.php.json");
    xhttp.send();
  }

  function getCoordinatesFromDegrees(degrees, radius = 1, centerX = 0, centerY = 0) {
    // 1. Convert degrees to radians
    const radians = degrees * (Math.PI / 180);

    // 2. Calculate x and y coordinates
    const x = centerX + radius * Math.cos(radians);
    const y = centerY + radius * Math.sin(radians);

    return { x, y };
  }

  function writeTime() {
    const nu = new Date();
    const uren = nu.getHours();
    const minuten = nu.getMinutes();
    const seconden = nu.getSeconds();
    // Bereken de hoeken in graden
    const uurGraden = ((uren % 12) + minuten / 60) * 30;
    const secondeGraden = seconden * 6;

    var point = getCoordinatesFromDegrees(uurGraden, 50);
    document.getElementById("hour").innerHTML = new Intl.DateTimeFormat(conf.l10n.language, { hour: 'numeric', minute: 'numeric'}).format(new Date());
    var centerx = (window.innerWidth - document.getElementById("hour").offsetWidth) / 2;
    var centery = (window.innerHeight - document.getElementById("hour").offsetHeight) / 2;

    document.getElementById("hour").style.left = centerx + (centerx * point.y/50) + "px";
    document.getElementById("hour").style.bottom = centery + (centery * point.x/50) + "px";

    point = getCoordinatesFromDegrees(secondeGraden, 50);
    document.getElementById("second").innerHTML = new Intl.DateTimeFormat(conf.l10n.language, { second: 'numeric'}).format(new Date());
    document.getElementById("second").style.width = document.getElementById("second").offsetHeight + "px";
    centerx = (window.innerWidth - document.getElementById("second").offsetWidth) / 2;
    centery = (window.innerHeight - document.getElementById("second").offsetHeight) / 2;

    document.getElementById("second").style.left = centerx + (centerx * point.y/50) + "px";
    document.getElementById("second").style.bottom = centery + (centery * point.x/50) + "px";

  }
  getConf();
// Get background image
  var xhr = new XMLHttpRequest();
  xhr.open('POST', "cli.php", true);
  xhr.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
  xhr.onload = function(e) {
    if (this.status == 200 && this.readyState === 4) {
      if (this.responseText != "[]") {
        const output = JSON.parse(this.responseText);
        document.body.style.backgroundImage = "url('" + output[0] + "')";
      }
    }
  };
  xhr.send("cmd=bash&params="+stringToHex("/var/www/html/background.sh"));
</script>
</body>
</html>
